[package]
name = "num-prime-bench"
version = "0.0.0"
edition.workspace = true
publish = false

[[bench]]
harness = false
name = "bench"

[dev-dependencies]
criterion = { package = "codspeed-criterion-compat", version = "6.0.0" }
glass_pumpkin = "2.0"
num-bigint = { version = "0.5.0", features = ["rand_0_9"] }
num-prime = { path = "..", features = ["big-int"] }
primal-check = "0.3.1"
rand = "0.9.0"
rand_010 = { package = "rand", version = "0.10.0" }
rand_chacha_010 = { package = "rand_chacha", version = "0.10.0" }
rand_core = "0.9.0"
