[package]
name = "num-prime"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
description = """
Generic and optimized primality test, factorization and various number theoretic functions with arbitrary precision based on `num`.
"""
documentation = "https://docs.rs/num-prime"
readme = "README.md"
repository = "https://github.com/uutils/num-prime"
license = "Apache-2.0"
keywords = ["bigint", "mathematics", "num", "number-theory", "primes"]
categories = ["algorithms", "cryptography", "science"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
  "bench",
]

[workspace.package]
edition = "2018"
rust-version = "1.70"

[dependencies]
bitvec = "1.0.0"
either = "1.6.1"
lru = "0.16.3"
num-integer = "0.1.46"
num-modular = "0.6.5"
num-traits = "0.2.18"
rand = "0.8.6"

[dependencies.num-bigint]
version = "0.4.6"
features = ["rand"]
optional = true

[dependencies.dashu-int]
version = "0.6.1"
optional = true
default-features = false
features = ["std", "num-integer", "num-traits", "num-modular", "rand_v08"]

[dependencies.dashu-base]
version = "0.6.1"
optional = true
default-features = false

[features]
default = ["dashu-int", "big-table"]
# TODO: use the new cargo feature to override the num-bigint option
big-int = [
  "num-bigint",
  "num-modular/num-bigint"
]
dashu-int = ["dep:dashu-int", "dep:dashu-base"]
big-table = []

# NOTE: temporary local-development patch. dashu-int's num-modular support
# (Reducer<UBig> for MontgomeryRepr, ModularSymbols for UBig, Pow<u32>) is not
# published yet; switch the dependency back to a crates.io version once
# dashu-int releases it.
[patch.crates-io]
dashu-base = { path = "/home/jacobz/dashu/base" }
dashu-int = { path = "/home/jacobz/dashu/integer" }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
