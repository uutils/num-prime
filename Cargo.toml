[package]
name = "num-prime"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
description = """
Generic and optimized primality test, factorization and various number theoretic functions with arbitrary precision based on `num`.
"""
documentation = "https://docs.rs/num-prime"
readme = "README.md"
repository = "https://github.com/uutils/num-prime"
license = "Apache-2.0"
keywords = ["bigint", "mathematics", "num", "number-theory", "primes"]
categories = ["algorithms", "cryptography", "science"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [
  "bench",
]

[workspace.package]
edition = "2018"
rust-version = "1.70"

[dependencies]
bitvec = "1.0.0"
either = "1.6.1"
lru = "0.16.3"
num-bigint = { version = "0.4.6", features = ["rand"], optional = true }
num-integer = "0.1.46"
num-modular = { version = "0.6.2", features = ["num-bigint"] }
num-traits = "0.2.18"
rand = "0.8.6"

[features]
default = ["big-int", "big-table"]
big-int = ["dep:num-bigint"]
big-table = []

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
